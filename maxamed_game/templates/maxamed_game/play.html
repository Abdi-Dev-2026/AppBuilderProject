<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxamed Games - {{ game.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
            --header-gradient: linear-gradient(145deg, #1e293b, #0f172a);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh; /* Waxaan ku xirnay dhererka guud ee shaashadda */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Si uusan browser-ka scroll ugu dhalan */
        }

        /* 🟢 NAVIGATION-KA (Waa la koobay dhererkiisa) */
        header {
            width: 100%;
            height: 56px; /* Dherer go'an oo dhuuban si uusan boos badan u qaadan */
            padding: 0 20px;
            background: var(--header-gradient);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .btn-back {
            padding: 6px 14px; /* Waa la yareeyay padding-ka */
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-back:hover {
            background: var(--accent-color);
            color: #000;
            transform: translateX(-2px);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* 🔵 MAGACA CIYAARTA (Waa la yareeyay booska uu dusha ka qaadanayo) */
        .game-header {
            text-align: center;
            padding: 10px 10px 5px 10px; /* Boos aad u yar */
        }

        .game-header h1 {
            font-size: clamp(1.2rem, 3vw, 1.6rem); /* Waa la yareeyay cabbirka qoraalka */
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 🟡 MEESHA CIYAARTA (Waa la toosiyey booska rasmiga ah) */
        .main-game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            width: 100%;
            /* Wuxuu xisabshayaa dhererka u haray ciyaarta oo kaliya */
            height: calc(100vh - 100px); 
            overflow: hidden;
        }

        /* ⚡ CARD-KA CIYAARTA: Wuxuu isu dhuubayaa hadba qaabka ciyaarta */
        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* dynamic size ayadoo aan waxba qarsameyn */
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
        }

        /* 🚀 CIYAARTA GUDUHEEDA (Sida Iframe, Canvas, ama Embed) */
        .game-card > iframe, 
        .game-card > canvas, 
        .game-card > embed,
        .game-card > div:not(.error-msg) {
            width: 100% !important;
            height: 100% !important;
            /* Waxay ilaalisaa dhererka iyo ballaca ciyaarta si uusan u dhalanrogmin qorshaheeda */
            max-width: 92vw; 
            max-height: 75vh;
            aspect-ratio: auto; /* Waxay oggolaataa in ciyaartu cabbirkeeda dabiiciga ah isticmaasho */
            object-fit: contain;
            border: none;
            border-radius: 8px;
            display: block;
            margin: auto;
        }

        /* ERROR MESSAGE */
        .error-msg {
            text-align: center;
            padding: 40px;
            color: #f87171;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            header { padding: 0 12px; }
            .game-header { padding: 8px 5px 2px 5px; }
            .main-game-container { padding: 5px; }
            .game-card { border-radius: 10px; padding: 6px; width: 100%; height: 100%; }
            .user-badge span { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'games_dashboard' %}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <div class="user-badge">
            <i class="fas fa-user-circle"></i> 
            <span>{{ user_profile.user.username|upper }}</span>
        </div>
    </header>

    <div class="game-header">
        <h1>{{ game.title }}</h1>
    </div>

    <main class="main-game-container">
        <div class="game-card">
            {% if specific_template %}
                {% include specific_template %}
            {% else %}
                <div class="error-msg">
                    <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
                    <p>Ciyaartaan weli template-keeda lama diyaarin saaxiib.</p>
                </div>
            {% endif %}
        </div>
    </main>

</body>
</html>
