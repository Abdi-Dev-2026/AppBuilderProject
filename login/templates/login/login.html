<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soo Gal - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #24243e, #302b63, #0f0c29);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 45px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        label {
            color: #a29bfe;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6c5ce7;
            background: rgba(255,255,255,0.1);
        }

        .btn-login {
            background: #6c5ce7;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #a29bfe;
            transform: translateY(-2px);
        }

        .remember {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember input {
            width: auto;
            margin-top: 0;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        .error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>

<body>

    <div class="auth-card shadow-lg">

        <h2>Soo Gal 👋</h2>
        <p class="subtitle">Geli Username / Email / ID + Password</p>

        <!-- 🔥 LOGIN FORM -->
        <form method="post">
            {% csrf_token %}

            <!-- IDENTIFIER -->
            <label>Username / Email / ID</label>
            <input type="text" name="identifier" placeholder="Geli username, email ama ID" required>

            <!-- PASSWORD -->
            <label>Password</label>
            <input type="password" name="password" placeholder="Geli password-kaaga" required>

            <!-- REMEMBER -->
            <div class="remember mt-3">
                <input type="checkbox" name="remember_me" id="remember_me">
                <label for="remember_me" style="margin-top: 0; cursor: pointer;">I xasuuso</label>
            </div>

            <!-- ERROR MESSAGE (optional Django message) -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <button type="submit" class="btn-login">
                Gali Koontada (Login)
            </button>
        </form>

        <div class="text-center mt-4">
            <p>
                Weli koonto ma haysid?
                <a href="{% url 'register' %}" class="text-info fw-bold">
                    Is-diiwaangeli
                </a>
            </p>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>

</body>
</html>
